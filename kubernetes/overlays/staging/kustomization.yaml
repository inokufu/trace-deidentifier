---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tdi-staging
namePrefix: staging-

resources:
  - ../../base
  - namespace.yaml


configMapGenerator:
  - behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - WORKERS_COUNT=2
    name: tdi-config

labels:
  - includeSelectors: true
    pairs:
      environment: staging

patches:
  - path: patches/tdi-deployment-patch.yaml
  - path: patches/tdi-ingress-patch.yaml

images:
  - name: tdi
    newName: rg.fr-par.scw.cloud/deidentification/tdi
    newTag: staging-latest
