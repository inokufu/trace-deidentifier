---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdi
  labels:
    app: tdi
    component: api
spec:
  selector:
    matchLabels:
      app: tdi
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tdi
        component: api
    spec:
      containers:
        - name: tdi
          image: tdi  # Generic name without tag (will be set by Kustomize)
          envFrom:
            - configMapRef:
                name: tdi-config
          ports:
            - containerPort: 8001
              name: http
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
            requests:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
